name: Test

# Finding and driving the browser differs per platform, so test on all three,
# with the oldest Node.js in `engines` and the one the release is made with.
# Version tags are left to the release workflow, which tests before publishing
on:
    push:
        branches: ['**']
    pull_request:

permissions:
    contents: read

# a newer push to the same branch or PR replaces the run in progress
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: ${{ matrix.os }}, Node.js ${{ matrix.node }}
        runs-on: ${{ matrix.os }}
        # a stuck browser shouldn't hold the runner for hours
        timeout-minutes: 15
        strategy:
            # keep the other platforms running to tell what's platform specific
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                node: ['22.12.0', '24']
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - run: npm ci --no-audit --no-fund

            # the record tests run in the runner's Google Chrome, every platform has one
            - run: npm test
